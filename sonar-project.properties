sonar.projectKey=budzow_COBOL_extensionless
sonar.organization=budzow-github

sonar.cobol.dialect=ibm-enterprise-cobol
sonar.cobol.sourceFormat=free

# COBOL suffixes set ...
sonar.cobol.file.suffixes=cbl

# ... and they do not collide with
# the setting needed for analysis of 
# extensionless sources
sonar.lang.patterns.cobol=**/*

sonar.exclusions=**/*.yml
